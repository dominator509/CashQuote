name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cashquote
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cashquote
      JWT_SECRET: ci-private-jwt-secret-for-tests-2026
      APP_ORIGIN: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      PILOT_ACCESS_CODE: ci-private-pilot-code-12345
      PILOT_EMAIL_ACCESS_CODES: '{"pilot@example.com":"ci-private-email-code-12345"}'
      PILOT_EMAIL_ALLOWLIST: pilot@example.com
      ALLOW_MOCK_EMAIL: "true"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - name: Build production Docker image
        run: docker build --tag cashquote:ci .
      - name: Boot production Docker image
        env:
          DOCKER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cashquote
        run: |
          set -euo pipefail
          container_name=cashquote-ci
          docker rm --force "$container_name" >/dev/null 2>&1 || true
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container_name" --network host \
            --env NODE_ENV=production \
            --env PORT=3200 \
            --env "DATABASE_URL=$DOCKER_DATABASE_URL" \
            --env JWT_SECRET=ci-private-jwt-secret-for-tests-2026 \
            --env APP_ORIGIN=http://127.0.0.1:3200 \
            --env CORS_ORIGIN=http://127.0.0.1:3200 \
            --env PILOT_ACCESS_CODE=ci-private-pilot-code-12345 \
            --env 'PILOT_EMAIL_ACCESS_CODES={"pilot@example.com":"ci-private-email-code-12345"}' \
            --env SMTP_URL=smtp://127.0.0.1:2525 \
            --env SMTP_FROM=ci@example.com \
            --env ALLOW_MOCK_EMAIL=false \
            --env TRUST_PROXY=false \
            cashquote:ci
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3200/readyz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Docker production image did not become ready"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:3200/healthz >/dev/null
          curl --fail --silent http://127.0.0.1:3200/ >/dev/null
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:security
      - run: node scripts/postgres-concurrency-smoke.mjs
      - run: npm audit --audit-level=high --fetch-retries=1 --fetch-timeout=30000
      - run: npm run smoke:prod
        env:
          SMTP_URL: smtp://127.0.0.1:2525
          SMTP_FROM: ci@example.com
          ALLOW_MOCK_EMAIL: "false"
      - run: npm run test:e2e
