name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cashquote
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cashquote
      JWT_SECRET: ci-secret-for-tests-only
      APP_ORIGIN: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      PILOT_ACCESS_CODE: ci-pilot-code
      PILOT_EMAIL_ALLOWLIST: pilot@example.com
      ALLOW_MOCK_EMAIL: "true"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:security
      - run: npm audit --audit-level=high
      - run: npm run smoke:prod
      - run: npm run test:e2e
